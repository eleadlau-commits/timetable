# Tests the app, then builds the Android app (APK), sends the iPhone app to TestFlight, and publishes
# the web version to GitHub Pages, every time you upload changes or press "Run workflow" on the
# Actions tab.
# If any test fails (including the database rules' tests), nothing is released, so a broken version
# never reaches anyone's phone.

name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to attach the APK to a release, and save the signing key
  pages: write      # to publish the web version
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Compiler tests, feature tests, and the delete-a-folder test, in Chrome.
      - name: Run all tests
        run: python build.py test --require-browser

  rules:
    name: Database rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4   # Google's database emulator needs Java
        with:
          distribution: temurin
          java-version: '21'
      # Checks firebase/firestore.rules: only you can read your own data, strangers can't, and so on.
      - name: Test the database rules
        working-directory: firebase
        run: |
          npm ci --no-audit --no-fund
          npm test

  android:
    name: Android app (APK)
    needs: [test, rules]
    # Only from main, so trying a branch with "Run workflow" (e.g. for the iPhone app) never
    # releases an APK.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compile the app
        run: python build.py --build ${{ github.run_number }}

      - name: Install Capacitor and the packages features asked for
        working-directory: dist
        run: npm install

      - name: Create the Android project
        working-directory: dist
        run: npx cap add android

      - name: Add the permissions features asked for
        run: python build.py android-manifest dist/android/app/src/main/AndroidManifest.xml

      - name: Add the files and settings features asked for
        run: python build.py android-project dist/android

      - name: Generate app icons
        continue-on-error: true   # falls back to the default icon if this fails
        working-directory: dist
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#e2dfe7' --iconBackgroundColorDark '#e2dfe7'

      # The icon tool above only makes the old-style PNG icons. Android 8 and newer use the
      # "adaptive" icon instead, which would otherwise still be the template's default.
      # android-res/ holds Mobile Durham's own (the cathedral on light grey, as vectors).
      - name: Use Mobile Durham's adaptive icon
        run: |
          cp -r android-res/. dist/android/app/src/main/res/
          grep -q md_icon_foreground dist/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Copy the app into the Android project
        working-directory: dist
        run: npx cap sync android

      # Every build must be signed with the same key, or Android refuses to install an
      # update over the old app (and you'd lose your notes and settings by uninstalling).
      # The first build creates the key and saves it in the repository.
      - name: Use the same signing key for every build
        run: |
          if [ ! -f signing/debug.keystore ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/debug.keystore
            git commit -m "Save signing key so app updates install over the old version"
            git push origin "HEAD:${{ github.ref_name }}" || echo "::warning::Couldn't save the signing key. The next build will make a new one."
          fi
          # Tell the build to sign with the saved key. (Copying it to ~/.android isn't enough:
          # on GitHub's machines the build looks elsewhere, quietly makes a new key every time,
          # and Android then refuses to install the update.)
          cat >> dist/android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  debug {
                      storeFile file("$GITHUB_WORKSPACE/signing/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          EOF

      - name: Set the version number
        run: |
          VERSION=$(python build.py version)
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION (build ${{ github.run_number }})\"/" dist/android/app/build.gradle
          grep -E "versionCode|versionName" dist/android/app/build.gradle

      - name: Build the APK
        working-directory: dist/android
        run: ./gradlew assembleDebug --no-daemon

      # Never release an APK signed with a different key: it wouldn't install over the app
      # people already have.
      - name: Check the APK is signed with the saved key
        run: |
          fingerprint() { grep -m1 'SHA256:' | sed -E 's/.*SHA256: *//' | tr -d ': ' ; }
          SAVED=$(keytool -list -v -keystore signing/debug.keystore -storepass android | fingerprint)
          APK=$(keytool -printcert -jarfile dist/android/app/build/outputs/apk/debug/app-debug.apk | fingerprint)
          echo "Saved key: $SAVED"
          echo "APK key:   $APK"
          if [ -z "$SAVED" ] || [ "$SAVED" != "$APK" ]; then
            echo "::error::The APK isn't signed with signing/debug.keystore, so it wouldn't install over the app people have. Nothing was released."
            exit 1
          fi

      - name: Name the APK
        run: cp dist/android/app/build/outputs/apk/debug/app-debug.apk MobileDurham.apk

      - name: Publish it as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mobile Durham (build ${{ github.run_number }})
          body: Open this page on your Android phone, tap **MobileDurham.apk** to download it, then open the file to install.
          files: MobileDurham.apk
          make_latest: true

  iphone:
    name: iPhone app (TestFlight)
    needs: [test, rules]
    runs-on: macos-15-intel   # Intel: GitHub often had no arm64 Mac free (macos-15), so the job was cancelled before it started
    # Needs four Apple settings in GitHub (Settings → Secrets and variables → Actions); see
    # "The iPhone app" in README.md. Until they're there, this job says so and stops, without
    # affecting the APK or the website.
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the Apple settings are there
        id: apple
        run: |
          missing=""
          # Without it, Firebase (sign-in) would close the app as soon as it opens.
          [ -f app/features/account/native/GoogleService-Info.plist ] || missing="$missing app/features/account/native/GoogleService-Info.plist"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$KEY" ] || missing="$missing APP_STORE_CONNECT_KEY"
          if [ -n "$missing" ]; then
            echo "::notice::The iPhone app wasn't built. Missing:$missing (see 'The iPhone app' in README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.apple.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - if: steps.apple.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Apple only accepts apps built with a recent Xcode.
      - if: steps.apple.outputs.ready == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Compile the app
        if: steps.apple.outputs.ready == 'true'
        run: python build.py --build ${{ github.run_number }}

      - name: Install Capacitor and the packages features asked for
        if: steps.apple.outputs.ready == 'true'
        working-directory: dist
        run: npm install

      - name: Create the iPhone project
        if: steps.apple.outputs.ready == 'true'
        working-directory: dist
        run: npx cap add ios --packagemanager CocoaPods

      # Info.plist entries, files (such as Firebase's GoogleService-Info.plist) and Podfile lines
      # from features' feature.json, plus the app's id, version, build number and Apple team.
      - name: Add the settings and files features asked for
        if: steps.apple.outputs.ready == 'true'
        run: |
          pip install pbxproj
          python build.py ios-project dist/ios/App --build ${{ github.run_number }} --team "$TEAM_ID"

      - name: Generate app icons
        if: steps.apple.outputs.ready == 'true'
        working-directory: dist
        run: npx --yes @capacitor/assets generate --ios --iconBackgroundColor '#e2dfe7' --iconBackgroundColorDark '#e2dfe7'

      - name: Copy the app into the iPhone project
        if: steps.apple.outputs.ready == 'true'
        working-directory: dist
        run: npx cap sync ios

      # Xcode signs the app itself, using the App Store Connect key (it needs Admin access to make
      # and keep the certificates), then sends it to App Store Connect, where it appears in
      # TestFlight after Apple has processed it (usually 5–30 minutes).
      - name: Build the iPhone app
        if: steps.apple.outputs.ready == 'true'
        working-directory: dist/ios/App
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/MobileDurham.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            archive | tail -n 200; test "${PIPESTATUS[0]}" -eq 0

      - name: Send it to TestFlight
        if: steps.apple.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MobileDurham.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  website:
    name: Web version (GitHub Pages)
    needs: [test, rules]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    # Only works once Pages is switched on (Settings → Pages → Source: GitHub Actions).
    # Until then this job fails without affecting the APK.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile the app
        run: python build.py --build ${{ github.run_number }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - id: deploy
        uses: actions/deploy-pages@v4
