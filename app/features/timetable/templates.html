<template id="setup">
  <div class="setup">
    <div class="panel">
      <h2>Connect your timetable</h2>
      <p class="hint" data-part="intro"></p>
      <div data-part="guide"></div>

      <label class="label" for="timetable-link">Timetable link</label>
      <div class="field">
        <input id="timetable-link" data-part="link" type="url" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="webcal://… or https://…">
        <button class="btn" data-part="paste" type="button">Paste</button>
      </div>
      <p class="received" data-part="received" hidden>Link received. Check it, then tap <i>Load timetable</i>.</p>
      <div class="error" data-part="error" role="alert" hidden></div>
      <button class="btn primary block" data-part="load" type="button">Load timetable</button>
      <p class="hint small" data-part="private"></p>
    </div>

    <div class="panel">
      <h3>Other ways to get the link in</h3>
      <div class="alt" data-part="extras"></div>
    </div>

    <button class="btn block back" data-part="back" type="button" hidden>Back to my timetable</button>
  </div>
</template>
